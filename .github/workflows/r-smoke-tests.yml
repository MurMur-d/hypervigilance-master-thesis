name: R smoke tests

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::dplyr
            any::ggplot2
            any::tidyr
            any::purrr
            any::tibble
            any::future
            any::future.apply
            any::memoise
            any::forcats
            any::patchwork
            any::here
            any::fs
            any::cowplot
            any::scales
            any::ggalluvial
            any::ggforce
            any::ggnewscale

      - name: Run testthat tests
        run: Rscript -e 'testthat::test_dir("tests/testthat")'

      - name: Run smoke prep
        run: Rscript tests/smoke_prep.R
